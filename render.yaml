services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: API_KEY
        sync: false        # you type this in the Render dashboard
      - key: DATABASE_URL
        sync: false        # paste your Neon connection string
      - key: WEB_PAGE_KEY
        sync: false        # optional: same as API_KEY so the page works instantly
